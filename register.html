<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Earn Money Thailand</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      margin: 0;
      padding: 30px 15px;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0001;
    }
    h1 {
      color: #176b45;
      text-align: center;
    }
    p {
      text-align: center;
      color: #555;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #176b45;
      color: white;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
    }
    a {
      color: #176b45;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Join Us</h1>
    <p>Create your Earn Money Thailand account</p>

    <form id="registerForm">
      <input type="text" placeholder="Your full name" required>
      <input type="email" placeholder="Your email address" required>
      <input type="password" placeholder="Create a password"
        minlength="6" required>
      <button type="submit">Create Account</button>
    </form>

    <p id="message"></p>
    <p><a href="index.html">Back to Home</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://lfvikmfpmcodlnqawmed.supabase.co";
  const SUPABASE_KEY = "sb_publishable_lhfefb25kkiZjUQ2wTLF3A_LjWyBYcA";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  document.getElementById("registerForm")
    .addEventListener("submit", async function(event) {
      event.preventDefault();

      const inputs = this.querySelectorAll("input");
      const name = inputs[0].value.trim();
      const email = inputs[1].value.trim();
      const password = inputs[2].value;
      const message = document.getElementById("message");

      message.textContent = "Creating account...";

      const { error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name }
        }
      });

      message.textContent = error
        ? error.message
        : "Account created! Please check your email.";
    });
</script>
</body>
</html>
